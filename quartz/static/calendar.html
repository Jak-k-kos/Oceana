<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oceana Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  :root {
    --light: #faf8f8; --lightgray: #e5e5e5; --gray: #b8b8b8; --darkgray: #4e4e4e;
    --dark: #2b2b2b; --secondary: #284b63; --tertiary: #84a59d;
    --highlight: rgba(143, 159, 169, 0.15);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --light: #161618; --lightgray: #393639; --gray: #646464; --darkgray: #d4d4d4;
    --dark: #ebebec; --secondary: #7b97aa; --tertiary: #84a59d;
    --highlight: rgba(143, 159, 169, 0.15);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--light);
    color: var(--darkgray);
    font-family: "Source Sans 3", "Source Sans Pro", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.4;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 4px 2px 12px; }
  h1, h2, h3 { font-family: "Schibsted Grotesk", system-ui, sans-serif; color: var(--dark); margin: 0; }

  /* Header */
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .title h1 { font-size: 1.9rem; line-height: 1.1; }
  .title h1 .yr { color: var(--gray); font-weight: 500; margin-left: .35em; }
  .era { color: var(--secondary); font-size: .95rem; margin-top: 2px; }
  .nav { display: flex; gap: 6px; align-items: center; }
  button {
    font: inherit; color: var(--darkgray); background: var(--light);
    border: 1px solid var(--lightgray); border-radius: 6px;
    padding: 4px 10px; cursor: pointer; min-height: 34px;
  }
  button:hover { border-color: var(--gray); color: var(--dark); }
  button:focus-visible { outline: 2px solid var(--secondary); outline-offset: 2px; }
  .nav .today { font-weight: 600; color: var(--secondary); }
  .nav .arrow { font-size: 1.1rem; padding: 2px 10px; }

  /* Grid */
  .grid { display: grid; grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); gap: 4px; }
  .wd { text-align: center; font-family: "Schibsted Grotesk", sans-serif; font-size: .8rem; letter-spacing: .06em; color: var(--gray); padding: 2px 0 4px; }
  .day {
    position: relative; text-align: left; min-height: 92px; padding: 6px 6px 5px;
    border: 1px solid var(--lightgray); border-top: 3px solid var(--season, var(--lightgray));
    border-radius: 6px; background: var(--light);
    display: flex; flex-direction: column; gap: 3px; cursor: pointer;
  }
  .day.pad { opacity: .4; }
  .day:hover { background: var(--highlight); }
  .day.sel { background: var(--highlight); border-color: var(--gray); border-top-color: var(--season, var(--gray)); }
  .day .num { font-weight: 600; color: var(--dark); font-size: .95rem; width: 1.7em; height: 1.7em; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; }
  .day.today .num { background: var(--secondary); color: var(--light); }
  .day .evs { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .pill { font-size: .72rem; line-height: 1.25; padding: 1px 5px; border-radius: 4px; background: color-mix(in srgb, var(--c) 22%, transparent); border-left: 3px solid var(--c); color: var(--dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day .moons { display: flex; gap: 1px; margin-top: auto; }
  .moon { display: block; }
  .moon .ring { stroke: #000; }
  :root[data-theme="dark"] .moon .ring { stroke: #8a8a90; }

  /* Detail */
  .lower { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-top: 16px; }
  .card { border: 1px solid var(--lightgray); border-radius: 8px; padding: 12px 14px; }
  .card h2 { font-size: 1.15rem; }
  .card h3 { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--gray); margin: 12px 0 6px; font-weight: 500; }
  .sub { color: var(--gray); font-size: .9rem; }
  .season-bar { height: 6px; border-radius: 3px; background: var(--lightgray); overflow: hidden; margin-top: 4px; }
  .season-bar > div { height: 100%; background: var(--season-c); }
  .moonrow { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .moonrow b { color: var(--dark); font-weight: 600; }
  .ev { padding: 6px 0 6px 10px; border-left: 3px solid var(--c); margin-bottom: 6px; }
  .ev a, .up a { color: var(--secondary); font-weight: 600; text-decoration: none; }
  .ev a:hover, .up a:hover { text-decoration: underline; }
  .ev p { margin: 2px 0 0; font-size: .9rem; }
  .none { color: var(--gray); font-style: italic; font-size: .92rem; }
  .up { list-style: none; margin: 0; padding: 0; }
  .up li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--lightgray); font-size: .94rem; }
  .up li:last-child { border-bottom: none; }
  .up .when { color: var(--gray); white-space: nowrap; text-align: right; }

  @media (max-width: 640px) {
    .lower { grid-template-columns: 1fr; }
    .day { min-height: 70px; padding: 4px; }
    .pill { font-size: 0; padding: 0; height: 5px; border-left-width: 0; background: var(--c); }
    .title h1 { font-size: 1.5rem; }
    .day .moons svg { width: 12px; height: 12px; }
  }
</style>
</head>
<body>

      <button class="arrow" id="prevM" title="Previous month" aria-label="Previous month">&lsaquo;</button>
      <button class="today" id="today" title="Jump to the current in-game date">Today</button>
      <button class="arrow" id="nextM" title="Next month" aria-label="Next month">&rsaquo;</button>
      <button class="arrow" id="nextY" title="Next year" aria-label="Next year">&raquo;</button>

  </div>
  <div class="grid" id="wdays"></div>
  <div class="grid" id="days" style="margin-top:2px"></div>

// ---- Calendarium date math -----------------------------------------------
let CAL, MONTHS, WEEK, YEAR_LEN, CAT;
const wrap = (n, m) => ((n % m) + m) % m;

function setup(cal) {
  CAL = cal;
  MONTHS = cal.static.months.filter(m => m.type === "month");
  WEEK = cal.static.weekdays;
  YEAR_LEN = MONTHS.reduce((a, m) => a + m.length, 0);
  CAT = Object.fromEntries((cal.categories || []).map(c => [c.id, c]));
}
function daysFromYearOne(y) {
  if (y == 1) return 0;
  const yr = y >= 1 ? y : y + 1;
  return Math.abs(yr - 1) * YEAR_LEN;

function firstDayOfYear(y) {
  const s = CAL.static;
  if (!s.overflow) return 0;
  if (y === 1) return s.firstWeekDay;
  const mult = y < 0 ? -1 : 1;
  return wrap(mult * ((daysFromYearOne(y) % WEEK.length) + mult * s.firstWeekDay), WEEK.length);
}
function weekdayOf(d) {
  if (!CAL.static.overflow) return wrap(d.day - 1, WEEK.length);
  return wrap(firstDayOfYear(d.year) + monthDaysBefore(d.month) + d.day - 1, WEEK.length);
}
function addDays(d, n) {
  let { year, month, day } = d;
  day += n;
  while (day > MONTHS[month].length) { day -= MONTHS[month].length; month++; if (month >= MONTHS.length) { month = 0; year++; } }
  while (day < 1) { month--; if (month < 0) { month = MONTHS.length - 1; year--; } day += MONTHS[month].length; }
  return { year, month, day };
}

function moonsFor(d) {
  const db = daysBefore(d);
  return (CAL.static.moons || []).map(moon => {
    const data = (db - Number(moon.offset || 0)) / Number(moon.cycle);
    const pos = data - Math.floor(data);
    const idx = wrap(Math.round((pos * 24) % 24), 24);
    return { ...moon, phase: PHASES[idx][0], shadow: PHASES[idx][1] };
  });
}

  }
  return list;
}

    if (e.date.year === y && e.date.month === m) return e;
    if (e.date.year < y || (e.date.year === y && e.date.month < m)) return e;
  }

}
const eraYear = (e, y) => e.isStartingEra ? y : y - e.date.year + 1;
function formatEra(e, y) {
  if (!e.format || !e.format.length) return e.name;
  const ey = eraYear(e, y);
  return e.format.replace("{{year}}", y).replace("{{abs_year}}", Math.abs(y)).replace("{{nth_year}}", ord(y))
    .replace("{{abs_nth_year}}", ord(Math.abs(y))).replace("{{era_year}}", ey).replace("{{era_nth_year}}", ord(ey))
    .replace("{{era_name}}", e.name);
}
function ord(n) { const s = ["th", "st", "nd", "rd"], v = Math.abs(n) % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

// Seasons (periodic), with colour blended toward the next season like Calendarium does
function seasonFor(d) {
  const sz = CAL.seasonal;
  if (!sz || !sz.seasons || !sz.seasons.length || sz.type !== "Periodic") return null;
  const ss = sz.seasons;
  const total = ss.reduce((a, s) => a + s.duration + (s.peak || 0), 0);
  let passed = (daysBefore(d) - (sz.offset || 0)) % total;
  const arr = [...ss, ss[0]];
  for (let i = 0; i < arr.length; i++) {
    const s = arr[i], len = s.duration + (s.peak || 0);
    if (passed - len <= 0) {
      const next = arr[wrap(i + 1, arr.length)];
      const perc = (passed - (s.peak || 0)) / s.duration;
      const color = passed <= (s.peak || 0) || !sz.interpolateColors ? s.color : mixLch(s.color, next.color, perc);
      return { ...s, perc: Math.max(0, Math.min(1, perc)), color, passed, remaining: len - passed };
    }
    passed -= len;
  }
  return null;
}
// sRGB <-> CIE LCH, for the season colour blend
function hexToRgb(h) { h = h.replace("#", ""); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255); }
function toLch(hex) {
  const lin = hexToRgb(hex).map(c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  const [r, g, b] = lin;
  let X = (0.4124 * r + 0.3576 * g + 0.1805 * b) / 0.95047, Y = 0.2126 * r + 0.7152 * g + 0.0722 * b, Z = (0.0193 * r + 0.1192 * g + 0.9505 * b) / 1.08883;
  const f = t => t > 216 / 24389 ? Math.cbrt(t) : (24389 / 27 * t + 16) / 116;
  const fx = f(X), fy = f(Y), fz = f(Z);
  const L = 116 * fy - 16, A = 500 * (fx - fy), B = 200 * (fy - fz);
  return [L, Math.hypot(A, B), (Math.atan2(B, A) * 180 / Math.PI + 360) % 360];
}
function fromLch([L, C, H]) {
  const A = C * Math.cos(H * Math.PI / 180), B = C * Math.sin(H * Math.PI / 180);
  const fy = (L + 16) / 116, fx = fy + A / 500, fz = fy - B / 200;
  const inv = t => t ** 3 > 216 / 24389 ? t ** 3 : (116 * t - 16) / (24389 / 27);
  const X = inv(fx) * 0.95047, Y = inv(fy), Z = inv(fz) * 1.08883;
  const lin = [3.2406 * X - 1.5372 * Y - 0.4986 * Z, -0.9689 * X + 1.8758 * Y + 0.0415 * Z, 0.0557 * X - 0.2040 * Y + 1.0570 * Z];
  return "#" + lin.map(c => { c = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; return Math.round(Math.max(0, Math.min(1, c)) * 255).toString(16).padStart(2, "0"); }).join("");
}
function mixLch(a, b, t) {
  const A = toLch(a), B = toLch(b);
  if (A[1] < 1) A[2] = B[2]; if (B[1] < 1) B[2] = A[2];
  let dh = B[2] - A[2]; if (dh > 180) dh -= 360; if (dh < -180) dh += 360;
  return fromLch([A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, (A[2] + dh * t + 360) % 360]);
}

// Events
function inYearRange(yr, y) {
  if (yr == null) return true;
  if (typeof yr === "number") return yr === y;
  const [a, b] = yr;
  return (a == null || y >= a) && (b == null || y <= b);
}
// Is this moon within its night window of full (target 0.5) or new (target 0)?
// Whole-number maths, so it can't drift: with whole-number offsets, a 1-night
// moon gets exactly one night per cycle and Ellehwin exactly three.
function moonOn(moon, d, target, nights) {
  const c = Number(moon.cycle);
  const k = wrap(daysBefore(d) - Number(moon.offset || 0), c);
  let diff = k - c * target;
  if (diff >= c / 2) diff -= c;
  if (diff < -c / 2) diff += c;
  diff = Math.round(diff * 1e6) / 1e6;
  return diff >= -nights / 2 && diff < nights / 2;
}
const nightsFor = m => (MOON_NIGHTS[m.name] || { nights: 1 }).nights;
function moonEventsOn(d) {
  const moons = CAL.static.moons || [], out = [];
  if (!moons.length) return out;
  for (const a of ALIGNMENTS) {
    const t = a.phase === "full" ? 0.5 : 0;
    if (moons.every(m => moonOn(m, d, t, nightsFor(m)))) out.push({ name: a.name, note: a.note, description: a.description, color: a.color });
  }
  for (const m of moons) {
    const cfg = MOON_NIGHTS[m.name];
    if (cfg && moonOn(m, d, 0.5, cfg.nights)) out.push({ name: cfg.name, note: cfg.note, description: `${m.name}'s full moon`, color: m.faceColor });
  }
  return out;
}
function eventsOn(d) { return [...calEventsOn(d), ...moonEventsOn(d)]; }
function calEventsOn(d) {
  return (CAL.events || []).filter(e => {
    const dt = e.date || {};
    if (dt.day != null && dt.day !== d.day) return false;
    if (dt.month != null && dt.month !== d.month) return false;
    return inYearRange(dt.year, d.year);
  });
}
function slug(path) {
  return path.replace(/\.md$/i, "").split("/").map(seg => seg.trim().toLowerCase()
    .replace(/\s/g, "-").replace(/&/g, "-and-").replace(/%/g, "-percent").replace(/[?#]/g, "")).join("/");
}
const noteUrl = e => e.note ? SITE_BASE + encodeURI(slug(e.note)) : null;
const catColor = e => e.color || (CAT[e.category] && CAT[e.category].color) || "#808080";

// ---- Rendering -------------------------------------------------------------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const same = (a, b) => a && b && a.year === b.year && a.month === b.month && a.day === b.day;
let view, selected, current;

function moonSvg(m, size) {
  return `<svg class="moon" width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true">` +
    `<circle cx="16" cy="16" r="10" fill="${esc(m.faceColor)}"/>` +
    (m.shadow ? `<path fill="${esc(m.shadowColor)}" d="${m.shadow}"/>` : "") +
    `<circle class="ring" cx="16" cy="16" r="10" fill="none" stroke-width="2"/></svg>`;
}
function dateLabel(d) { return `${d.day} ${MONTHS[d.month].name}`; }

function render() {
  const { year, month } = view;
  const era = eraForMonth(year, month);
  $("mname").innerHTML = `${esc(MONTHS[month].name)}<span class="yr">${era ? eraYear(era, year) : year}</span>`;
  $("era").textContent = era ? formatEra(era, year) : "";

  root.style.setProperty("--cols", WEEK.length);
  $("wdays").innerHTML = WEEK.map(w => `<div class="wd" title="${esc(w.name)}">${esc(w.abbreviation || w.name.slice(0, 3))}</div>`).join("");

  const first = weekdayOf({ year, month, day: 1 });
  const cells = [];
  for (let i = first; i > 0; i--) cells.push({ d: addDays({ year, month, day: 1 }, -i), pad: true });
  for (let day = 1; day <= MONTHS[month].length; day++) cells.push({ d: { year, month, day } });
  let tail = 1;
  while (cells.length % WEEK.length) cells.push({ d: addDays({ year, month, day: MONTHS[month].length }, tail++), pad: true });

  $("days").innerHTML = cells.map(({ d, pad }, i) => {
    const s = seasonFor(d), evs = eventsOn(d), ms = CAL.static.displayMoons ? moonsFor(d) : [];
    const cls = ["day", pad && "pad", same(d, current) && "today", same(d, selected) && "sel"].filter(Boolean).join(" ");
    const label = `${WEEK[weekdayOf(d)].name}, ${dateLabel(d)}${evs.length ? ", " + evs.map(e => e.name).join(", ") : ""}`;
    return `<button class="${cls}" data-i="${i}" style="${s && CAL.seasonal.displayColors ? `--season:${s.color}` : ""}" aria-label="${esc(label)}">` +
      `<span class="num">${d.day}</span>` +
      `<span class="evs">${evs.map(e => `<span class="pill" style="--c:${esc(catColor(e))}">${esc(e.name)}</span>`).join("")}</span>` +
      `<span class="moons">${ms.map(m => moonSvg(m, 15)).join("")}</span></button>`;
  }).join("");
  $("days").querySelectorAll(".day").forEach(b => b.addEventListener("click", () => {
    const d = cells[+b.dataset.i].d;
    selected = d;
    if (d.month !== view.month || d.year !== view.year) view = { year: d.year, month: d.month };
    render();
  }));

  renderDetail();
  renderUpcoming();
  fitFrame();
}

function renderDetail() {
  const d = selected, s = seasonFor(d), evs = eventsOn(d), ms = moonsFor(d);
  const era = eraForMonth(d.year, d.month);
  let h = `<h2>${esc(WEEK[weekdayOf(d)].name)}, ${esc(dateLabel(d))}</h2>`;
  h += `<div class="sub">${era ? esc(formatEra(era, d.year)) : "Year " + d.year}${same(d, current) ? " &middot; <b style='color:var(--secondary)'>Today</b>" : ""}</div>`;
  if (s) {
    const dayIn = Math.min(s.duration + (s.peak || 0), Math.max(1, Math.ceil(s.passed)));
    h += `<h3>Season</h3><div><b style="color:var(--dark)">${esc(s.name)}</b> <span class="sub">&middot; day ${dayIn} of ${s.duration + (s.peak || 0)}</span></div>`;
    h += `<div class="season-bar" style="--season-c:${s.color}"><div style="width:${(dayIn / (s.duration + (s.peak || 0))) * 100}%"></div></div>`;
  }
  if (ms.length) {
    h += `<h3>Moons</h3>` + ms.map(m => `<div class="moonrow">${moonSvg(m, 26)}<span><b>${esc(m.name)}</b> <span class="sub">&middot; ${esc(m.phase)}</span></span></div>`).join("");
  }
  h += `<h3>Events</h3>`;
  h += evs.length ? evs.map(e => {
    const url = noteUrl(e);
    const name = url ? `<a href="${esc(url)}" target="_top">${esc(e.name)}</a>` : `<b>${esc(e.name)}</b>`;
    return `<div class="ev" style="--c:${esc(catColor(e))}">${name}${e.description ? `<p>${esc(e.description)}</p>` : ""}</div>`;
  }).join("") : `<div class="none">Nothing marked on this day.</div>`;
  $("detail").innerHTML = h;
}

function renderUpcoming() {
  const out = [];
  for (let n = 0; n <= YEAR_LEN && out.length < 6; n++) {
    const d = addDays(selected, n);
    for (const e of eventsOn(d)) {
      if (n > 0 && eventsOn(addDays(selected, n - 1)).some(p => p.name === e.name)) continue;
      if (out.length < 6) out.push({ e, d, n });
    }
  }
  $("upcoming").innerHTML = out.length ? out.map(({ e, d, n }) => {
    const url = noteUrl(e);
    const name = url ? `<a href="${esc(url)}" target="_top">${esc(e.name)}</a>` : esc(e.name);
    const when = n === 0 ? "this day" : n === 1 ? "next day" : `in ${n} days`;
    return `<li><span>${name}<br><span class="sub">${esc(dateLabel(d))}</span></span><span class="when">${when}</span></li>`;
  }).join("") : `<li class="none">No events in the next year.</li>`;
}

// Let the page size its own frame on the wiki (same site, so this is allowed)
function fitFrame() {
  try {
    const f = window.frameElement;
    if (f) requestAnimationFrame(() => { f.style.height = Math.ceil(document.querySelector(".wrap").getBoundingClientRect().height) + 8 + "px"; });
  } catch (e) {}
}
window.addEventListener("resize", fitFrame);

function step(months) {
  let m = view.month + months, y = view.year;
  while (m < 0) { m += MONTHS.length; y--; }
  while (m >= MONTHS.length) { m -= MONTHS.length; y++; }
  view = { year: y, month: m };
  selected = { year: y, month: m, day: Math.min(selected.day, MONTHS[m].length) };
  render();
}
$("prevM").onclick = () => step(-1);
$("nextM").onclick = () => step(1);
$("prevY").onclick = () => step(-MONTHS.length);
$("nextY").onclick = () => step(MONTHS.length);
$("today").onclick = () => { selected = { ...current }; view = { year: current.year, month: current.month }; render(); };

function start(cal) {
  setup(cal);
  current = { ...cal.current };
  selected = { ...current };
  view = { year: current.year, month: current.month };
  render();
}

// Prefer the live copy of Calendarium's data next to this page, fall back to the snapshot.
fetch("calendarium.json", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(data => {
    const cals = data.calendars || [];
    const cal = cals.find(c => c.id === data.defaultCalendar) || cals[0];
    if (!cal) throw 0;
    start(cal);
  })
  .catch(() => start(SNAPSHOT));
</script>
</body>
